
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ongkee petshop</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf9f5;color:#263c31;font-family:Arial}
header{padding:20px 7%;background:white;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold}
.logo span{color:#72977c}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:#365d47;color:white}
.hero{margin:25px auto;max-width:1100px;background:#e7eee5;border-radius:22px;padding:45px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.hero h1{font-size:42px}
.hero img{width:100%;height:280px;object-fit:cover;border-radius:18px}
.section{max-width:1100px;margin:50px auto;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 15px #0001}
.card img{width:100%;height:210px;object-fit:cover}
.info{padding:17px}
.price{font-size:19px;color:#365d47;font-weight:bold;margin:12px 0}
.info button{width:100%}
.cart{background:white;border-radius:16px;padding:22px;margin-top:35px}
.item{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}
footer{background:#263c31;color:white;text-align:center;padding:30px}
input{padding:13px;border:1px solid #ddd;border-radius:10px}
@media(max-width:650px){
.hero{grid-template-columns:1fr;padding:25px}
.hero h1{font-size:32px}
.grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
 <div class="logo">🐾 PetShop <span>ongke
.</span></div>
 <button onclick="document.getElementById('keranjang').scrollIntoView()">🛒 Keranjang (<span id="count">0</span>)</button>
</header>

<section class="hero">
 <div>
  <p>WELCOME TO PETSHOP ongkeee</p>
  <h1>Temukan Sahabat Terbaikmu!</h1>
  <p>Berbagai hewan lucu untuk menjadi teman terbaikmu.</p>
  <button onclick="document.getElementById('produk').scrollIntoView()">Lihat Hewan →</button>
 </div>
 <img src="rafif.jpg" alt="Kucing">
</section>

<section class="section" id="produk">
 <h2>🐾 Katalog Hewan</h2>
 <input id="search" placeholder="Cari hewan..." oninput="render()">
 <br><br>
 <div class="grid" id="products"></div>

 <div class="cart" id="keranjang">
  <h2>🛒 Keranjang</h2>
  <div id="items">Keranjang kosong.</div>
  <h3 id="total">Total: Rp0</h3>
  <button onclick="checkout()">Pesan WhatsApp</button>
 </div>
</section>

<footer>
 <h2>🐾 PetShop Rafif</h2>
 <p>Sayangi hewan, mereka adalah keluarga.</p>
</footer>

<script>
const animals=[
 {name:"musang",cat:"musang",price:100000,img:"rafif.jpg"},
 {name:"musangv2",cat:"musangv2",price:1200000,img:"WIN_20261008_14_06_33_Pro.jpg"},
 {name:"Anjing",cat:"Anjing",price:2500000,img:"WIN_20261029_14_08_02_Pro.jpg"},
 {name:"Kelinci imut kyut",cat:"Kelinci",price:50000img:"WhatsApp Image 2026-10-31 at 20.09."},
 {name:"Hamster imup",cat:"Hamster imup",price:1000
  ,img:"Ok.jpg"},
 {name:"Burung",cat:"Burung",price:350000,img:"burung.jpg"}
];

let cart=[];

function rupiah(n){
 return "Rp"+n.toLocaleString("id-ID");
}

function render(){
 let q=document.getElementById("search").value.toLowerCase();
 let data=animals.filter(a=>a.name.toLowerCase().includes(q));
 document.getElementById("products").innerHTML=data.map(a=>`
 <div class="card">
  <img src="${a.img}" alt="${a.name}"
   onerror="this.src='https://placehold.co/500x300?text=Masukkan+Foto'">
  <div class="info">
   <small>${a.cat}</small>
   <h3>${a.name}</h3>
   <div class="price">${rupiah(a.price)}</div>
   <button onclick="add('${a.name}')">+ Keranjang</button>
  </div>
 </div>`).join("");
}

function add(name){
 let a=animals.find(x=>x.name===name);
 let item=cart.find(x=>x.name===name);
 if(item)item.qty++;
 else cart.push({...a,qty:1});
 update();
}

function update(){
 document.getElementById("count").innerText=
 cart.reduce((s,a)=>s+a.qty,0);

 document.getElementById("items").innerHTML=
 cart.length?cart.map((a,i)=>`
 <div class="item">
 ${a.name} x${a.qty}
 <span>${rupiah(a.price*a.qty)}
 <button onclick="removeItem(${i})">Hapus</button></span>
 </div>`).join(""):"Keranjang kosong.";

 document.getElementById("total").innerText="Total: "+
 rupiah(cart.reduce((s,a)=>s+a.price*a.qty,0));
}

function removeItem(i){
 cart.splice(i,1);
 update();
}

function checkout(){
 if(!cart.length)return alert("Keranjang kosong!");

 let msg="Halo PetShop Rafif, saya ingin memesan:\n";
 cart.forEach(a=>msg+=a.name+" x"+a.qty+"\n");
 msg+="Total: "+rupiah(cart.reduce((s,a)=>s+a.price*a.qty,0));

 // Ganti dengan nomor WhatsApp tokomu
 let nomor="6281234567890";
 window.open("https://wa.me/"+nomor+"?text="+encodeURIComponent(msg));
}

render();
</script>
</body>
</html>
